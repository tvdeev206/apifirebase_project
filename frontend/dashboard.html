<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReNO Dashboard</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif&family=Rethink+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Rethink Sans"', 'sans-serif'],
            serif: ['"Hedvig Letters Serif"', 'serif'],
          },
          colors: {
            brand: {
              orange: '#FA9819',
              deepOrange: '#CD4900',
              blueTint: '#B6C9CF',
              babyBlue: '#C6EBF7',
              navy: '#1E3D59',
              caption: '#48749E',
              skyBlue: '#DEEEFE',
              offBlue: '#E8EBEF',
              darkGrey: '#A3A3A3',
              grey: '#E5E5E5',
            }
          }
        }
      }
    }

    function logout() {
      localStorage.clear();
      sessionStorage.clear();
      window.location.href = "login.html";
    }
  </script>
</head>

<body class="bg-white text-black font-sans antialiased selection:bg-brand-orange selection:text-white overflow-hidden">

  <!-- MOBILE HEADER -->
  <header class="block lg:hidden sticky top-0 bg-white border-b border-gray-100 z-50">
    <div class="flex justify-between items-center p-5">
      <div class="font-bold text-xl tracking-tighter">ReNO</div>

      <button
        onclick="logout()"
        class="hover:text-brand-orange transition-colors"
      >
        Logout
      </button>
    </div>
  </header>

  <div class="flex min-h-screen relative overflow-hidden">

    <!-- Background -->
    <div class="absolute -top-32 -left-32 w-[500px] h-[500px] bg-brand-babyBlue opacity-40 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-[400px] h-[400px] bg-brand-orange/10 rounded-full blur-3xl"></div>

    <!-- SIDEBAR -->
    <nav class="hidden lg:flex w-[180px] border-r border-gray-100 p-8 flex-col fixed h-screen bg-white/70 backdrop-blur-sm z-20">

      <!-- Logo -->
      <div class="font-bold text-3xl tracking-tighter mb-12">
        ReNO
      </div>

      <!-- Navigation -->
      <ol class="flex flex-col gap-3 font-medium text-[15px] mb-auto">

        <li>
          <a
            href="dashboard.html"
            class="flex items-center px-4 py-3 rounded-xl bg-brand-offBlue text-brand-orange"
          >
            Dashboard
          </a>
        </li>

        <li>
          <a
            href="note.html"
            class="flex items-center px-4 py-3 rounded-xl hover:bg-brand-offBlue hover:text-brand-orange transition"
          >
            Notes
          </a>
        </li>

        <li>
          <button
            onclick="logout()"
            class="w-full flex items-center px-4 py-3 rounded-xl hover:bg-brand-offBlue hover:text-brand-orange transition text-left"
          >
            Logout
          </button>
        </li>

      </ol>

      <!-- Footer -->
      <div class="flex flex-col gap-3 text-sm text-gray-500 font-medium">

        <a
          href="https://github.com/tvdeev206/apifirebase_project"
          target="_blank"
          class="hover:text-black transition-colors"
        >
          GitHub
        </a>

        <a href="#" class="hover:text-black transition-colors">
          Documentation
        </a>

      </div>

    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex-1 lg:ml-[180px] p-10 overflow-y-auto">

    <div class="mb-10">
        <h1 class="text-5xl font-bold tracking-tighter mb-4">
        Dashboard
        </h1>

        <p class="text-gray-500 text-lg">
        Your saved notes workspace
        </p>
    </div>

    <!-- Notes Grid -->
    <div
        id="notesContainer"
        class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"
    >
    </div>

    </main>

  </div>

  <script type="module" src="../backend/dashboard.js"></script>
</body>
</html>
